name: wejo

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: wejo
      POSTGRES_PASSWORD: wejo
      POSTGRES_DB: wejo_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wejo -d wejo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
