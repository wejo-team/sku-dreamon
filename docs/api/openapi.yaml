openapi: 3.1.0
info:
  title: 서경드림온 제품 API 설계안
  version: 0.1.0-draft
  description: 'PR #96의 검토용 계약. 모든 operation 미구현. 인증 전달 방식/세션 수명과 표시된 미정 분기는 구현 전 결정 필요. x-auth-policy는
    권한 설명이며 실제 OpenAPI securityScheme을 대신하지 않는다. security 생략은 공개 API 선언이 아니며 이 문서로 무인증 client/server/mock을
    생성·배포하지 않는다. 기능 정책은 specs, DB 구조는 database가 원본이다.'
servers:
- url: /api/v1
  description: 예정된 제품 API 접두사. 배포/동작 서버 주소 아님.
x-implementation-status: design-only
x-auth-transport: 'TBD: authentication.md#open-questions / AUTH-04 review required'
tags:
- name: Accounts
  description: 자체 가입·로그인·본인 계정. 인증 전달은 별도 미정.
- name: Profiles
  description: 본인 프로필 편집·공개 설정·로그인한 사람 탐색.
- name: Catalogs
  description: 공통 선택지와 학사 경로 조회.
- name: Contests
  description: 등록 공고의 공개 탐색과 상세.
- name: Teams
  description: 공개 모집글·생성·팀 공간·모집 종료와 재개.
- name: Applications
  description: 지원 시도·본인 취소·팀장 검토와 선발.
- name: AI
  description: 현재 대화와 권한에 따른 지원자 검토 요청·결과. 내부 LLM 구조는 미정.
- name: Notifications
  description: 본인 서비스 알림·미읽음 수·읽음 처리.
paths:
  /accounts:
    post:
      operationId: createAccount
      summary: 자체 회원가입
      tags:
      - Accounts
      description: 로그인 아이디·비밀번호 정책을 검증한 뒤 계정과 credential을 함께 생성한다. 409 LOGIN_ID_TAKEN. 가입 후 자동 로그인과 인증
        전달물은 미정이며 이 응답은 계정 생성 성공만 뜻한다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/authentication.md#login-identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /auth/login-id-availability:
    get:
      operationId: checkLoginIdAvailability
      summary: 로그인 아이디 중복 확인
      tags:
      - Accounts
      description: 현재 시점의 아이디 중복 확인이며 가입 예약이 아니다. 형식 오류는422. 탈퇴 아이디 재사용은 정책 확정 전 가입 가능으로 안내하지 않는다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdAvailability'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: loginId
        in: query
        schema:
          type: string
        description: 정규화 규칙을 적용할 입력 아이디.
        required: true
  /auth/login:
    post:
      operationId: login
      summary: 자체 로그인
      tags:
      - Accounts
      description: 본인 계정 응답을 제안한다. 아이디와 비밀번호의 실패 원인을 구분하지 않고401 INVALID_CREDENTIALS를 반환한다. 세션 전달·수명 결정
        후 실제 인증 wire contract를 추가해야 구현할 수 있다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/authentication.md#open-questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /auth/logout:
    post:
      operationId: logout
      summary: 현재 로그인 세션 종료
      tags:
      - Accounts
      description: 현재 로그인 세션을 종료한다. 다른 기기의 전체 로그아웃을 뜻하지 않는다. 클라이언트는 성공 후 계정별 AI 화면·초안을 제거하고 진행 응답을 취소한다.
        세션 전달·만료 계약이 선행되어야 한다.
      x-contract-status: proposed
      x-auth-policy: authenticated
      responses:
        '204':
          description: 성공. 응답 본문 없음.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getCurrentAccount
      summary: 본인 계정 조회
      tags:
      - Accounts
      description: 현재 인증 주체의 계정 데이터만 반환한다. 다른 사용자의 로그인 아이디는 제공하지 않는다.
      x-contract-status: proposed
      x-auth-policy: authenticated
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/profile:
    get:
      operationId: getMyProfile
      summary: 본인 현재 프로필 조회
      tags:
      - Profiles
      description: 현재 인증 주체의 프로필을 반환한다. 아직 프로필을 저장하지 않았다면404 RESOURCE_NOT_FOUND.
      x-contract-status: proposed
      x-auth-policy: self
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveMyProfile
      summary: 전체 프로필 편집값 저장
      tags:
      - Profiles
      description: 최초 저장과 수정 모두200. 최초 expectedVersion은 문자열0, 수정은 조회한 version이다. 409 VERSION_CONFLICT,
        INVALID_CATALOG_SELECTION, INVALID_ACADEMIC_PATH. 프로필 기본값·연결 목록·포트폴리오는 함께 저장하고 공개 상태는 일반 편집으로
        변경하지 않는다.
      x-contract-status: proposed
      x-auth-policy: self
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/profile.md#input-validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
  /me/profile/visibility:
    put:
      operationId: setProfileVisibility
      summary: 전체 프로필 공개 여부 변경
      tags:
      - Profiles
      description: 공개 전환 확인 후 저장한다. 프로필이 없으면404, 버전 불일치는409 VERSION_CONFLICT. 버전이 일치하고 같은 값이면 no-op200,
        실제 변경은 version 증가와 함께 저장한다. 일반 검색과 AI의 후속 응답은 새 공개 상태를 적용한다.
      x-contract-status: proposed
      x-auth-policy: self
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/profile.md#visibility-changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisibilityWrite'
  /catalogs:
    get:
      operationId: getCatalogs
      summary: 공통 선택지 조회
      tags:
      - Catalogs
      description: 분야·역할·역량·학적·학년·주당 시간·아바타를 반환한다. 각 목록은 sortOrder ASC, code ASC. 현재 입력 선택과 기존 값 표시가 같은
        코드 사전을 사용한다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogs'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalogs/academic-placements:
    get:
      operationId: getAcademicCatalog
      summary: 학사 경로 목록 조회
      tags:
      - Catalogs
      description: 현재·비활성 학사 경로를 ID ASC로 반환한다. 실제 공식 학사 목록은 검증 후 등록하며 새 선택과 기존 경로 유지의 검증을 구분한다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicCatalog'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/academic-structure.md#selection-policy
  /people:
    get:
      operationId: listPeople
      summary: 공개 사람 탐색
      tags:
      - Profiles
      description: 현재 공개 프로필만 목록과 total에 포함한다. q는 이름·자기소개·분야·역할·역량 표시명 검색을 제안한다. 정렬은 updatedAt DESC, accountId
        ASC. 지원받은 팀장 예외는 일반 검색에 적용하지 않는다.
      x-contract-status: proposed
      x-auth-policy: authenticated
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/profile.md#people-directory
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/FieldCode'
      - $ref: '#/components/parameters/RoleCode'
  /people/{accountId}:
    get:
      operationId: getPublicPerson
      summary: 공개 사람 상세
      tags:
      - Profiles
      description: 현재 공개 프로필만 반환한다. 비공개·미존재는404. 지원받은 팀장의 비공개 열람은 해당 지원자 경로에서 별도로 확인한다.
      x-contract-status: proposed
      x-auth-policy: authenticated
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /contests:
    get:
      operationId: listContests
      summary: 공모전 탐색
      tags:
      - Contests
      description: q는 제목·주최자·분야 표시명을 검색한다. 등록순은 createdAt DESC, id DESC; 마감순은 endsAt ASC, id ASC. registrationStatus
        생략 시 마감 공고 포함·배치는 CONTEST-05 선행 결정이 필요하다. 목록 조회는 모집 가능 보장이 아니다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/contests.md#exploration-ui
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/FieldCode'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_desc
          - deadline_asc
        description: 기본 created_desc. 등록순의 동률은 id DESC, 마감순의 동률은 id ASC.
      - name: registrationStatus
        in: query
        schema:
          $ref: '#/components/schemas/RegistrationStatus'
        description: 명시하면 해당 접수상태만 조회. 생략 시 마감공고 배치·포함 방식은 CONTEST-05 선행 결정.
  /contests/{contestId}:
    get:
      operationId: getContest
      summary: 공모전 상세
      tags:
      - Contests
      description: 접수 예정·중·마감의 등록 공고를 공개 조회한다. 원문 참가 조건·공식 링크·일정 보완 정보를 함께 제공한다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: contestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /contests/{contestId}/teams:
    get:
      operationId: listContestTeams
      summary: 해당 공모전의 팀 목록
      tags:
      - Teams
      description: 현재 contestId와 일치하는 팀만 조회한다. q는 팀명·소개/목표·모집 역할 표시명을 검색하며 정렬은 createdAt DESC, id DESC.
        contest.teamCount는 전체 팀 수, pagination.total은 현재 필터 결과 수다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-policy-source: ../specs/contests.md#contest-teams
      parameters:
      - name: contestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/RoleCode'
      - $ref: '#/components/parameters/RecruitingOnly'
  /teams:
    get:
      operationId: listTeams
      summary: 팀 탐색
      tags:
      - Teams
      description: q는 팀명·소개/목표·모집 역할·공모전명을 검색한다. 정렬은 createdAt DESC, id DESC. 공개 모집 정보만 반환한다.
      x-contract-status: proposed
      x-auth-policy: public
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/RoleCode'
      - $ref: '#/components/parameters/RecruitingOnly'
      - name: contestId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: 선택한 공모전 제한.
    post:
      operationId: createTeam
      summary: 팀 생성
      tags:
      - Teams
      description: 공고·공식 인원·현재 소속·입력을 검증한 뒤 팀과 팀장 소속을 함께 생성한다. 409 CONTEST_NOT_OPEN, CAPACITY_OUT_OF_RANGE,
        MEMBERSHIP_CONFLICT, INVALID_CATALOG_SELECTION. 같은 requestId/같은 정규화된 최초 입력은200, 다른 입력은409 REQUEST_ID_REUSED.
        팀 생성 시 대기 지원 처리와 프로필 완성 요구는 TEAM-04·PROFILE-03을 먼저 결정해야 한다.
      x-contract-status: proposed
      x-auth-policy: authenticated
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: 같은 requestId와 같은 정규화된 원요청의 재전송. 기존 리소스 반환.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
      x-policy-source: ../specs/team-recruitment.md#official-capacity
      requestBody:
