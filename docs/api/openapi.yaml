      required:
      - clientMessageId
      - content
      description: 같은 전송 재시도는 같은 clientMessageId+같은 본문을 사용. 같은 ID 다른 본문은409. 새 메시지는 새 ID.
      x-text-counting: 'PROFILE-07: policy character limits recorded; Unicode counting contract pending'
    AiMessage:
      type: object
      additionalProperties: false
      properties:
