    AiRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          $ref: '#/components/schemas/AiPurpose'
        conversationId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        messageId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        teamId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        applicationId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        attempt:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        status:
          $ref: '#/components/schemas/AiRequestStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        result:
          anyOf:
          - $ref: '#/components/schemas/AiResult'
          - type: 'null'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AiFailure'
          - type: 'null'
      required:
      - id
      - purpose
      - conversationId
      - messageId
      - teamId
      - applicationId
      - attempt
      - status
      - createdAt
      - updatedAt
      - result
      - failure
      description: 서버가 목적·상태 조합을 검증한 실행 리소스. 요청의 현재 권한과 대상 관계는 조회 때도 재검사한다. 아래 allOf가 목적별 참조와 상태별 결과/오류
        조합을 정의한다. 저장소·큐·모델·영속 테이블은 선택하지 않는다.
      allOf:
      - if:
          properties:
            purpose:
              const: chat
        then:
          properties:
            conversationId:
              $ref: '#/components/schemas/Id'
            messageId:
              $ref: '#/components/schemas/Id'
            teamId:
              type: 'null'
            applicationId:
              type: 'null'
            result:
              anyOf:
              - type: 'null'
              - type: object
                properties:
                  kind:
                    const: chat
      - if:
          properties:
            purpose:
              const: applicant_review
        then:
          properties:
            teamId:
              $ref: '#/components/schemas/Id'
            applicationId:
              $ref: '#/components/schemas/Id'
            conversationId:
              type: 'null'
            messageId:
              type: 'null'
            result:
              anyOf:
              - type: 'null'
              - type: object
                properties:
                  kind:
                    const: applicant_review
      - if:
          properties:
            purpose:
              const: applicant_recommendation
        then:
          properties:
            teamId:
              $ref: '#/components/schemas/Id'
            conversationId:
              type: 'null'
            messageId:
              type: 'null'
            applicationId:
              type: 'null'
            result:
              anyOf:
              - type: 'null'
              - type: object
                properties:
                  kind:
                    const: applicant_recommendation
      - if:
          properties:
            status:
              const: pending
        then:
          properties:
            result:
              type: 'null'
            failure:
              type: 'null'
      - if:
          properties:
            status:
              const: succeeded
        then:
          properties:
            result:
              $ref: '#/components/schemas/AiResult'
            failure:
              type: 'null'
      - if:
          properties:
            status:
              const: empty
        then:
          properties:
            result:
              $ref: '#/components/schemas/AiResult'
            failure:
              type: 'null'
      - if:
          properties:
            status:
              const: failed
        then:
          properties:
            result:
              type: 'null'
            failure:
              $ref: '#/components/schemas/AiFailure'
      - if:
          properties:
            status:
              const: canceled
        then:
          properties:
            result:
              type: 'null'
            failure:
              type: 'null'
      examples:
      - id: 44444444-4444-4444-8444-444444444444
        purpose: chat
        conversationId: 55555555-5555-4555-8555-555555555555
        messageId: 66666666-6666-4666-8666-666666666666
        teamId: null
        applicationId: null
        attempt: 1
        status: empty
        createdAt: '2026-10-20T03:00:00Z'
        updatedAt: '2026-10-20T03:00:02Z'
        result:
          kind: chat
          answer: 현재 조건에 맞는 결과가 없습니다. 조건을 바꿔 다시 찾아볼 수 있어요.
          cards: []
          generatedAt: '2026-10-20T03:00:02Z'
          referencesChanged: false
        failure: null
