      - fieldCodes
      - roleCodes
      description: kind별 존재하는 실제 리소스와 현재 권한을 서버가 확인한 카드만 반환. 임의 모델 URL을 그대로 제공하지 않음.
    ChatResult:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: chat
        answer:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCard'
          maxItems: 3
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
        referencesChanged:
          type: boolean
      required:
      - kind
      - answer
      - cards
      - generatedAt
      - referencesChanged
      description: 현재 권한으로 제공할 수 없는 이전 답변·이유는 전체를 정보 변경 안내로 대체하고 cards=[]로 반환한다. 카드만 지우고 본문의 개인정보를 남기지
        않는다.
    ApplicantReviewResult:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: applicant_review
        applicationId:
          $ref: '#/components/schemas/Id'
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
        profileVersions:
          type: array
          items:
            $ref: '#/components/schemas/ProfileVersion'
          minItems: 1
          maxItems: 1
        isStale:
          type: boolean
        isSelectionCandidate:
          type: boolean
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - kind
      - applicationId
      - summary
      - evidence
      - profileVersions
      - isStale
      - isSelectionCandidate
      - generatedAt
      description: 선발/미선발/취소/폐기도 기존 검토 가능. isStale=true이면 현재 프로필 근거처럼 표시하지 않고 재요청 안내. profileVersions는
        사용한 버전과 현재 버전을 구분.
    ApplicantRecommendation:
      type: object
      additionalProperties: false
      properties:
        applicationId:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
        profileVersion:
          $ref: '#/components/schemas/ProfileVersion'
      required:
      - applicationId
      - reason
      - profileVersion
    ApplicantRecommendationResult:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: applicant_recommendation
        summary:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantRecommendation'
        isStale:
          type: boolean
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - kind
      - summary
      - candidates
      - isStale
      - generatedAt
      description: 현재 유효한 자기 팀 지원자만 반환한다. 일반 대화의 카드3개 제한을 지원자 검토 인원 상한으로 확대하지 않는다. 후보 상태가 달라지면 후보와 본문
        근거를 함께 재검증한다.
    AiResult:
      oneOf:
      - $ref: '#/components/schemas/ChatResult'
      - $ref: '#/components/schemas/ApplicantReviewResult'
      - $ref: '#/components/schemas/ApplicantRecommendationResult'
      discriminator:
        propertyName: kind
        mapping:
          chat: '#/components/schemas/ChatResult'
          applicant_review: '#/components/schemas/ApplicantReviewResult'
          applicant_recommendation: '#/components/schemas/ApplicantRecommendationResult'
    Notification:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - application_status_changed
          - new_application
        applicationId:
          $ref: '#/components/schemas/Id'
        teamId:
          $ref: '#/components/schemas/Id'
        eventStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        readAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        title:
          type: string
        body:
          type: string
      required:
      - id
      - kind
      - applicationId
      - teamId
      - eventStatus
      - occurredAt
      - readAt
      - title
      - body
      description: 당시 사건의 상태이며 현재 지원 상태와 구분. 표시문구는 현재 권한으로 구성. 읽음/과거 수신이 대상의 현재 열람 권한을 대신하지 않음.
    NotificationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/PageMeta'
        unreadCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - items
      - pagination
      - unreadCount
      description: 본인 권한과 목록 필터의 items/total. unreadCount는 필터와 무관한 본인의 전체 미읽음 수. 모두 읽음은 클라이언트에 이미 제공된
        ID 집합만 요청한다.
    UnreadCount:
      type: object
      additionalProperties: false
      properties:
        unreadCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - unreadCount
    ReadNotifications:
      type: object
      additionalProperties: false
      properties:
        notificationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          uniqueItems: true
      required:
      - notificationIds
      description: 현재 사용자에게 제공되어 UI에서 읽음 대상으로 선택한 IDs. 모두읽음도 조회로 제공된 ID의 합집합을 전달; 아직 제공되지 않은 항목은 변경하지
        않음.
    ReadNotificationsResult:
      type: object
      additionalProperties: false
      properties:
        updatedIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        unreadCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - updatedIds
      - unreadCount
      description: 이미 읽은 본인 ID도 성공 결과에 포함한다. 하나라도 타인/없는 ID면404이며 전체 요청은 변경 없이 실패한다.
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - REQUEST_ID_REUSED
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - RESOURCE_NOT_FOUND
          - LOGIN_ID_TAKEN
          - PROFILE_REQUIRED
          - PROFILE_PRIVATE
          - VERSION_CONFLICT
          - INVALID_CATALOG_SELECTION
          - INVALID_ACADEMIC_PATH
          - CONTEST_NOT_OPEN
          - TEAM_FULL
          - RECRUITMENT_CLOSED
          - RECRUITMENT_DEADLINE_PASSED
          - CAPACITY_OUT_OF_RANGE
          - DUPLICATE_APPLICATION
          - MEMBERSHIP_CONFLICT
          - INVALID_APPLICATION_STATE
          - INVALID_RECRUITMENT_STATE
          - REQUEST_ALREADY_RUNNING
          - REQUEST_NOT_RETRYABLE
          - ATTEMPT_CONFLICT
          - MESSAGE_ID_CONFLICT
          - RATE_LIMITED
          - TEMPORARY_UNAVAILABLE
          - INTERNAL_ERROR
        message:
          type: string
      required:
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
      required:
      - error
      - requestId
      description: 기계 분기는 error.code, 사람에게는 message. 비밀번호/입력전문/DB오류/권한밖존재정보를 포함하지 않음.
      examples:
      - error:
          code: VERSION_CONFLICT
          message: 정보가 변경되었습니다. 최신 상태를 확인해 주세요.
        requestId: request-correlation-example
    ValidationIssue:
      type: object
      additionalProperties: false
      properties:
        loc:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
              maximum: 9007199254740991
        msg:
          type: string
        type:
          type: string
      required:
      - loc
      - msg
      - type
      description: FastAPI validation detail의 loc/msg/type와 호환. 민감한 input 원문은 응답에서 제거.
    ValidationError:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          minItems: 1
      required:
      - detail
    DeadlineInput:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        time:
          anyOf:
          - type: string
            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          - type: 'null'
        timeZone:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - date
      description: 사용자가 입력한 원문 날짜·선택 시각·선택 시간대. time/timeZone 생략은 null과 같다. 시간대는 IANA 식별자 또는 명시적 UTC offset으로
        정규화해 검증한다. 서버가 마감 정책에 따라 closesAt과 보완 플래그를 계산한다. 유효하지 않거나 단일 시각으로 결정할 수 없는 입력은422이며 임의로 추정하지 않는다.
    DeadlineInterpretation:
      type: object
      additionalProperties: false
      properties:
        sourceDate:
          type: string
          format: date
        sourceTime:
          anyOf:
          - type: string
          - type: 'null'
        sourceTimeZone:
          anyOf:
          - type: string
          - type: 'null'
        effectiveTimeZone:
          type: string
        timeDefaulted:
          type: boolean
        timeZoneDefaulted:
          type: boolean
      required:
      - sourceDate
      - sourceTime
      - sourceTimeZone
      - effectiveTimeZone
      - timeDefaulted
      - timeZoneDefaulted
      description: 실제 입력과 서비스 보완을 구분하기 위한 응답. 마감 경계는 상위의 endsAt/recruitmentEndsAt으로 제공한다.
