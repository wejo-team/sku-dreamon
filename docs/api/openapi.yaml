        문법 검증용 가상 값이며 실제 등록 데이터나 운영 카탈로그 코드를 뜻하지 않는다.
      allOf:
      - if:
          properties:
            capacity:
              const: '1'
        then:
          properties:
            roleCodes:
              maxItems: 0
        else:
          properties:
            roleCodes:
              minItems: 1
      x-text-counting: 'PROFILE-07: policy character limits recorded; Unicode counting contract pending'
      examples:
      - requestId: 11111111-1111-4111-8111-111111111111
        contestId: 22222222-2222-4222-8222-222222222222
        name: 예시 프로젝트 팀
        introduction: 공모전에 함께 참여할 동료를 찾는 예시 팀입니다.
        capacity: '4'
        roleCodes:
        - ROLE_EXAMPLE
        recruitmentDeadline:
          date: '2026-11-30'
          time: null
          timeZone: null
