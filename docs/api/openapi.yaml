components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
        maximum: 9007199254740991
      description: 요청 페이지 번호. 마지막 초과는 마지막 유효 페이지로 보정;0/음수/비정수는422.
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 한 페이지 크기. 기본20/최대100은 검토용 기술 제안.
    Search:
      name: q
      in: query
      schema:
        type: string
      description: 앞뒤 공백 제거 후 검색. 빈 문자열은 검색 없음. 검색 대상은 각 operation에 정의.
    FieldCode:
      name: fieldCode
      in: query
      schema:
        $ref: '#/components/schemas/CatalogCode'
      description: 분야 하나. 저장된 전체 분야 중 해당 코드를 포함하는 결과.
    RoleCode:
      name: roleCode
      in: query
      schema:
        $ref: '#/components/schemas/CatalogCode'
      description: 역할 하나. 모집/희망 역할 조건.
    RecruitingOnly:
      name: recruitingOnly
      in: query
      schema:
        type: boolean
        default: false
      description: 현재 공통 모집 가능 조건을 충족한 팀만.
    ApplicationStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ApplicationStatus'
      description: 현재 지원 상태 하나. 생략은 모든 상태.
  responses:
    Unauthenticated:
      description: 인증 실패 또는 세션 만료. UNAUTHENTICATED; 로그인에서는 INVALID_CREDENTIALS도 사용.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 인증됐지만 행동 권한 없음. FORBIDDEN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스가 없거나 요청자에게 존재를 노출할 수 없음. RESOURCE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 현재 상태·유일성·동시 변경 충돌. 해당 operation의 오류 코드 참조.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 요청 제한. RATE_LIMITED. 한도/기간은 운영 설계 TBD.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 일시적 서비스 장애. TEMPORARY_UNAVAILABLE. 실패한 쓰기는 성공으로 반환하지 않음.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 예상하지 못한 내부 오류. INTERNAL_ERROR. 미정 기능의 placeholder 응답으로 사용하지 않음.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 422 요청 타입·형식·필드 조합 오류. camelCase 이외의 필드와 미정의 필드는 거부.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Id:
      type: string
      format: uuid
      description: 불변 리소스 식별자. 임의 UUID 형식이며 특정 생성 버전을 API가 전제하지 않음.
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO 8601, Z 표기. 화면은 표시 시간대로 변환.
    CatalogCode:
      type: string
      minLength: 1
      maxLength: 64
      description: 목록별 불변 코드. 실제 코드 사전은 카탈로그 계약에서 검토하며 표시명은 코드가 아님.
    HttpUrl:
      type: string
      format: uri
      pattern: ^https?://
      description: HTTP(S) 절대 URL. 사용자 입력 URL의 운영 길이 상한은 PROFILE-07 검토 전 미확정.
    PositiveBigInt:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: 양의 BIGINT 십진 문자열. 최대 9223372036854775807. 문자열 형태는 JS 정수 정밀도 손실을 피하기 위한 기술 계약이며 업무 상한이
        아님.
    NonnegativeBigInt:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: 0 이상 BIGINT 십진 문자열. 최대 9223372036854775807.
    Version:
      $ref: '#/components/schemas/PositiveBigInt'
    CatalogItem:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/CatalogCode'
        displayName:
          type: string
        isSelectable:
          type: boolean
        sortOrder:
          type: integer
          format: int32
      required:
      - code
      - displayName
      - isSelectable
      - sortOrder
    AvatarPreset:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/CatalogCode'
        displayName:
          type: string
        isSelectable:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        assetUrl:
          $ref: '#/components/schemas/HttpUrl'
      required:
      - code
      - displayName
      - isSelectable
      - sortOrder
      - assetUrl
    Catalogs:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        academicStatuses:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        grades:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        weeklyAvailabilityRanges:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        avatarPresets:
          type: array
          items:
            $ref: '#/components/schemas/AvatarPreset'
      required:
      - fields
      - roles
      - skills
      - academicStatuses
      - grades
      - weeklyAvailabilityRanges
      - avatarPresets
      description: 현재 선택 가능 항목과 기존 참조 해석에 필요한 비활성 항목을 함께 반환. 새 선택에는 isSelectable=true만 허용하며 기존 선택 보존은
        기능 명세에 따름.
    AcademicPlacement:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        unitId:
          $ref: '#/components/schemas/Id'
        unitCode:
          $ref: '#/components/schemas/CatalogCode'
        kind:
          type: string
          enum:
          - college
          - department
          - major
        label:
          type: string
        parentPlacementId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        isSelectable:
          type: boolean
        majorSelectionMode:
          anyOf:
          - type: string
            enum:
            - none
            - selectable
          - type: 'null'
        allowsUnassigned:
          type: boolean
        effectiveScope:
          anyOf:
          - type: string
          - type: 'null'
        sourceReference:
          type: string
          description: 공식 웹 주소 또는 공식 자료 식별 참조.
      required:
      - id
      - unitId
      - unitCode
      - kind
      - label
      - parentPlacementId
      - isSelectable
      - majorSelectionMode
      - allowsUnassigned
      - effectiveScope
      - sourceReference
    AcademicCatalog:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicPlacement'
      required:
      - items
      description: ID ASC 순의 평탄한 경로 목록. 부모 관계로 화면 트리를 구성한다. 표시 순서의 학사 정책은 추가하지 않으며 공식 운영 목록은 검증 후 등록한다.
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
