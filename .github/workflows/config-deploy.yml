# 코드·이미지를 유지하며 지정한 설정 버전만 적용하거나 복구한다.
name: Production configuration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Configuration operation
        required: true
        type: choice
        options: [status, apply, rollback, recover]
        default: status
      parameter_version:
        description: Exact SSM version for apply; use 0 for other operations
        required: true
        type: string
        default: "0"

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  configuration:
    name: Apply production configuration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'wejo-team/sku-dreamon'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DEPLOY_CONFIG_SSM_DOCUMENT: ${{ vars.DEPLOY_CONFIG_SSM_DOCUMENT }}
      CONFIG_ACTION: ${{ inputs.action }}
      CONFIG_VERSION: ${{ inputs.parameter_version }}
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate request and main checks
        run: >-
          python deploy/config_cd.py gate --sha "$GITHUB_SHA"
          --action "$CONFIG_ACTION" --version "$CONFIG_VERSION"
      - name: Obtain temporary deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dreamon-config-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Apply or recover configuration without building code
        run: >-
          python deploy/config_cd.py run --sha "$GITHUB_SHA"
          --action "$CONFIG_ACTION" --version "$CONFIG_VERSION"
