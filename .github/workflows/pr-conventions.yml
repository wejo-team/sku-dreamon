name: PR conventions

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate the current PR title
        run: python scripts/check_pr_title.py
      - name: Validate PR source and target branches
        run: python scripts/check_pr_branch.py
