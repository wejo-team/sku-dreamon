name: Docs and Wiki

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer main run cancels the earlier publication; PRs have separate groups.
concurrency:
  group: docs-wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test Wiki exporter
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate links and export Wiki pages
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
        run: python scripts/export_wiki.py --repository "$REPOSITORY" --ref "$SOURCE_REF"

  publish:
    name: Publish Wiki
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Skip reruns of commits superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          latest_ref=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest_ref" = "$SOURCE_REF" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; leave the Wiki unchanged.'
          fi
      - name: Export Wiki pages from the validated commit
        if: steps.current.outputs.publish == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
        run: python scripts/export_wiki.py --repository "$REPOSITORY" --ref "$SOURCE_REF"
      - name: Publish pages to this repository's Wiki
        if: steps.current.outputs.publish == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          token: ${{ github.token }}
          path: .wiki-build
          direction: push
          strategy: clone
          preprocess: "false"
          disable-empty-commits: "true"
