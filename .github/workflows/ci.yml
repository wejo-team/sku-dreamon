# 변경 영향 범위에 따라 앱 검사를 실행하고 필수 검사 결과를 확인한다.
name: Application CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      deployment: ${{ steps.scope.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Select affected areas
        id: scope
        run: python scripts/ci_scope.py

  frontend_checks:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - run: npm install --global npm@9.2.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend_checks:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://wejo:wejo@127.0.0.1:5432/wejo_test
      TEST_DATABASE_URL: postgresql+asyncpg://wejo:wejo@127.0.0.1:5432/wejo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: wejo
          POSTGRES_PASSWORD: wejo
          POSTGRES_DB: wejo_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:size=1g
          --health-cmd "pg_isready -U wejo -d wejo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m app.core.db.check
      - run: uv run pytest

  deployment_checks:
    name: Deployment static checks
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify Compose CLI without starting Docker services
        run: docker compose version --short
      - name: Check release units and Compose configuration
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("deploy/tests", pattern="test_*.py")
          if suite.countTestCases() == 0:
              raise SystemExit("Deployment unit tests are required.")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY

  integration:
    name: Integration E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: wejo
          POSTGRES_PASSWORD: wejo
          POSTGRES_DB: wejo_e2e
        ports:
          - 55433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:size=1g
          --health-cmd "pg_isready -U wejo -d wejo_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          enable-cache: false
      - run: npm install --global npm@9.2.0
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
        working-directory: backend
      - name: Use official Ubuntu archive mirrors
        run: |
          # Azure의 저속 전송은 APT 무응답 timeout으로 전환되지 않는다. runner-images#14823
          mirror_list=/etc/apt/apt-mirrors.txt
          if ! grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources ||
             ! grep -Eq '^https://archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:2$' "$mirror_list" ||
             ! grep -Eq '^https://security\.ubuntu\.com/ubuntu/[[:space:]]+priority:3$' "$mirror_list"; then
            echo '::error::Expected the official Ubuntu runner APT mirror configuration.'
            exit 1
          fi
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]\+priority:1$|d' "$mirror_list"
          if grep -Eq '^http://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$mirror_list"; then
            echo '::error::Unexpected Azure APT mirror entry remains.'
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/prepare_bugbash.py --database-name wejo_e2e
      - name: Prepare isolated database
        working-directory: backend
        run: |
          uv run --env-file ../.bugbash/backend.env alembic upgrade head
          uv run --env-file ../.bugbash/backend.env python -m scripts.seed_e2e_data --apply
      - name: Run HTTPS integration tests
        env:
          E2E_DATASET: synthetic-ci-fixture
        run: python scripts/run_bugbash.py
      - name: Run AI UI with a fixture model and real HTTPS API
        env:
          E2E_DATASET: synthetic-ci-fixture-model
        run: python scripts/run_bugbash.py --ai-fixture
      - name: Save synthetic-data E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-e2e
          path: |
            .bugbash/runs/**/report/**
            .bugbash/runs/**/test-results/**
            .bugbash/runs/**/results.json
            .bugbash/runs/**/execution.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

  # 변경 영향이 없어 앱 테스트를 생략해도 필수 검사 이름은 유지한다.
  frontend:
    name: Frontend
    needs: [changes, frontend_checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify required frontend result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.frontend }}
          CHECK_RESULT: ${{ needs.frontend_checks.result }}
        run: python scripts/check_ci_job.py
      - name: Verify integration result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' }}
          CHECK_RESULT: ${{ needs.integration.result }}
        run: python scripts/check_ci_job.py

  backend:
    name: Backend
    needs: [changes, backend_checks, integration, deployment_checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify required backend result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.backend }}
          CHECK_RESULT: ${{ needs.backend_checks.result }}
        run: python scripts/check_ci_job.py
      - name: Verify integration result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' }}
          CHECK_RESULT: ${{ needs.integration.result }}
        run: python scripts/check_ci_job.py
      - name: Verify deployment static result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.deployment }}
          CHECK_RESULT: ${{ needs.deployment_checks.result }}
        run: python scripts/check_ci_job.py

  production:
    name: Production CD
    needs: [frontend, backend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_CD_ENABLED == 'true'
    permissions:
      contents: read
      checks: read
      id-token: write
    uses: ./.github/workflows/cd.yml
