name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - run: npm install --global npm@9.2.0
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://wejo:wejo@127.0.0.1:5432/wejo_test
      TEST_DATABASE_URL: postgresql+asyncpg://wejo:wejo@127.0.0.1:5432/wejo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: wejo
          POSTGRES_PASSWORD: wejo
          POSTGRES_DB: wejo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wejo -d wejo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -m scripts.export_openapi --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m app.db.check
      - run: uv run pytest
