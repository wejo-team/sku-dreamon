# main의 검증된 커밋만 임시 AWS 권한으로 운영에 반영한다.
name: Production CD

on:
  workflow_call:

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  release:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DEPLOY_SSM_DOCUMENT: ${{ vars.DEPLOY_SSM_DOCUMENT }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require successful checks for the latest main commit
        id: gate
        run: python deploy/cd.py gate --sha "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.current == 'true'
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Build the production frontend
        if: steps.gate.outputs.current == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_API_MOCK: "false"
        run: |
          npm install --global npm@9.2.0
          npm ci
          npm run build
      - name: Obtain temporary deployment credentials
        if: steps.gate.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dreamon-cd-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Publish and verify the release
        if: steps.gate.outputs.current == 'true'
        run: python deploy/cd.py deploy --sha "$GITHUB_SHA"
