[project]
name = "sku-dreamon-backend"
version = "0.1.0"
description = "SKU DreamOn API for student contests and ongoing challenges"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = "==0.11.30"
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic/env.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: checks HTTP or database integration boundaries",
    "database: requires an isolated PostgreSQL via TEST_DATABASE_URL",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
